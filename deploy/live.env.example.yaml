# Copy to staging.local.env.yaml, never use a production project for preview testing.
# This deliberately cannot enable live routing until the gates are implemented/reviewed.
APP_MODE: "live"
HOST: "0.0.0.0"
FIREBASE_PROJECT_ID: "REPLACE_WITH_SEPARATE_ENV_PROJECT"
GOOGLE_CLOUD_PROJECT: "REPLACE_WITH_SEPARATE_ENV_PROJECT"
FIRESTORE_DATABASE_ID: "(default)"
GCS_BUCKET: "REPLACE_WITH_PRIVATE_ENV_BUCKET"
TASKS_LOCATION: "REPLACE_WITH_APPROVED_REGION"
TASKS_QUEUE: "REPLACE_WITH_ENV_ROUTING_QUEUE"
TASKS_SERVICE_ACCOUNT_EMAIL: "REPLACE_WITH_TASK_INVOKER_ACCOUNT"
WORKER_URL: "REPLACE_WITH_DEPLOYED_WORKER_HTTPS_URL"
TURNSTILE_ALLOWED_HOSTNAMES: "REPLACE_WITH_COMMA_SEPARATED_STAGING_WEBSITE_HOSTS"
# Optional only after approval: POLICY_CONFIG_PATH: "/app/deploy/policy/approved.json"
# Optional only after approval: PROVIDER_CONFIG_PATH: "/app/deploy/providers/approved.json"
# Provider API keys and named feed tokens are injected through config.providerSecrets.
# Keep provider gates disabled until docs/gates.md is resolved.
# Secret values are injected from Secret Manager by deploy-services.ps1.
